name: Bug report
description: Something in the platform is broken.
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [admin portal, ocpp-gateway, database/RLS, driver app, CI/infra, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
