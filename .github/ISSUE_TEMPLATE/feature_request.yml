name: Feature request
description: Propose a feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase (see plan)
      options:
        [
          'Phase 1 — gateway',
          'Phase 2 — admin',
          'Phase 3 — tariffs/CDRs',
          'Phase 4 — driver app',
          'Phase 5 — payments',
          'Phase 6 — white-label',
          'Phase 7+ — advanced',
          'unsure',
        ]
