# Fly.io staging config for the OCPP gateway. Deploy from the repo root:
#   flyctl deploy -c infra/fly.staging.toml --remote-only
#
# Region sin = same neighbourhood as Supabase ap-southeast-1 (Singapore), which
# is also the closest region to Malaysia. Every charger message is a database
# write, so the gateway and the database must not be on different continents.
#
# Runtime secrets are NOT here — set them with `flyctl secrets set`:
#   DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY
# See docs/deploy-gateway.md.

app = "voltara-gateway-staging"
primary_region = "sin"

[build]
  # Relative to THIS file, not the repo root. The build context is still the
  # working directory the deploy runs from (the repo root), which is what the
  # COPY paths inside the Dockerfile assume.
  dockerfile = "Dockerfile.gateway"

[env]
  GATEWAY_PORT = "9221"
  LOG_LEVEL = "info"
  # Off only to debug a specific non-conforming charger; see the quirks layer.
  OCPP_STRICT_MODE = "true"

[http_service]
  internal_port = 9221
  # No forced HTTPS redirect: chargers cannot follow redirects, so a silent 301
  # is the worst possible answer to a plaintext ws:// attempt. Instead the
  # gateway itself decides per charger — Security Profile 2 (default) rejects
  # plaintext WITH a logged reason; profile 1 (explicit commissioning/legacy
  # flag) accepts it. Admin/driver traffic does not ride this hostname.
  force_https = false
  # Never scale to zero. A charger holds one WebSocket open for days; a
  # sleeping gateway is an offline charging network.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
